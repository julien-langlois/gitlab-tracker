[workspace]
resolver = "3"
members = [
    "gitlab-tracker",
    "gitlab-tracker-core",
    "gitlab-tracker-redmine",
    "gitlab-tracker-stats",
]

[workspace.package]
version = "0.6.0"
authors = ["Julien Langlois <julien@julienlanglois.fr>"]
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/julien-langlois/gitlab-tracker"

[workspace.dependencies]
# Internal crates
gitlab-tracker-core = { version = "0.6.0", path = "gitlab-tracker-core" }
gitlab-tracker-redmine = { version = "0.6.0", path = "gitlab-tracker-redmine" }
gitlab-tracker-stats = { version = "0.6.0", path = "gitlab-tracker-stats" }
# Third-party crates used by several members. Features listed here apply to every
# member; each member adds the extra features it needs (e.g. tokio, chrono).
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
directories = "5.0"
inventory = "0.3"
# One store per OS, each feature only compiled on its own platform: Secret Service
# (GNOME Keyring / KWallet) on Linux, Keychain on macOS, Credential Manager on
# Windows. Without its feature, keyring falls back to an in-memory mock store
# and the token is lost on exit.
keyring = { version = "3", features = ["sync-secret-service", "crypto-openssl", "apple-native", "windows-native"] }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The tracker's state (tracker.db) and the stats (stats.db). 0.9.1 accepts
# libsqlite3-sys 0.39, which fixes RUSTSEC-2026-0459.
sqlx = { version = "0.9.1", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
thiserror = "2"
anyhow = "1"
tokio = "1"
toml = { version = "0.8", features = ["parse"] }
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
