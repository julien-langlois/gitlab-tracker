[workspace]
resolver = "3"
members = [
    "gitlab-tracker",
    "gitlab-tracker-core",
    "gitlab-tracker-redmine",
    "gitlab-tracker-stats",
]

[workspace.package]
version = "0.4.8"
authors = ["Julien Langlois <julien@julienlanglois.fr>"]
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/julien-langlois/gitlab-tracker"

[workspace.dependencies]
# Internal crates
gitlab-tracker-core = { version = "0.4.8", path = "gitlab-tracker-core" }
gitlab-tracker-redmine = { version = "0.4.8", path = "gitlab-tracker-redmine" }
gitlab-tracker-stats = { version = "0.4.8", path = "gitlab-tracker-stats" }
# Third-party crates used by several members. Features listed here apply to every
# member; each member adds the extra features it needs (e.g. tokio, chrono).
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
directories = "5.0"
inventory = "0.3"
keyring = { version = "3", features = ["sync-secret-service", "crypto-openssl"] }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"
toml = { version = "0.8", features = ["parse"] }
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
