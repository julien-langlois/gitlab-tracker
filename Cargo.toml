[package]
name = "gitlab-tracker"
authors = ["Julien Langlois <julien@julienlanglois.fr>"]
version = "0.2.0"
edition = "2021"
description = "A fast terminal TUI dashboard for tracking GitLab Merge Requests across branches"
license = "MIT"
repository = "https://github.com/julien-langlois/gitlab-tracker"
readme = "README.md"
keywords = ["gitlab", "tui", "ratatui", "cli", "dashboard"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = { version = "0.30", features = ["crossterm_0_28"] }
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
urlencoding = "2.1"
directories = "5.0"
keyring = "2"
open = "5"
notify-rust = "4"
clap = { version = "4.6.3", features = ["derive"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
