[package]
name = "gitlab-tracker"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "A fast terminal TUI dashboard for tracking GitLab Merge Requests across branches"
keywords = ["gitlab", "tui", "ratatui", "cli", "dashboard"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["../assets/"]

[[bin]]
name = "gitlab-tracker"
path = "src/main.rs"

[features]
default = ["notifications"]
notifications = ["dep:notify-rust"]
redmine = ["dep:gitlab-tracker-redmine"]
stats = ["dep:gitlab-tracker-stats"]

[dependencies]
gitlab-tracker-core = { workspace = true, features = ["secrets"] }
gitlab-tracker-redmine = { workspace = true, optional = true }
gitlab-tracker-stats = { workspace = true, optional = true }
inventory.workspace = true
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
terminal-colorsaurus = "1.0.3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
dotenvy = "0.15"
urlencoding = "2.1"
directories.workspace = true
keyring.workspace = true
open.workspace = true
# Desktop notifications (feature `notifications`, on by default).
notify-rust = { version = "4", optional = true }
arboard = { version = "3", default-features = false }
clap = { version = "4.6.3", features = ["derive"] }
chrono.workspace = true
futures = "0.3"
toml.workspace = true
figment = { version = "0.10", features = ["toml", "json", "env"] }
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize.workspace = true

[dev-dependencies]
# Test doubles implementing the `TrackerProvider` trait.
async-trait.workspace = true
