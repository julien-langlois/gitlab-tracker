[package]
name = "gitlab-tracker"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "A fast terminal TUI dashboard for tracking GitLab Merge Requests across branches"
keywords = ["gitlab", "tui", "ratatui", "cli", "dashboard"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["../assets/"]

[[bin]]
name = "gitlab-tracker"
path = "src/main.rs"

[features]
default = ["notifications"]
notifications = ["gitlab-tracker-notify/desktop"]
redmine = ["dep:gitlab-tracker-redmine", "dep:gitlab-tracker-core"]

[dependencies]
gitlab-tracker-notify = { version = "0.3.1", path = "../gitlab-tracker-notify" }
gitlab-tracker-core    = { version = "0.3.1", path = "../gitlab-tracker-core",    optional = true }
gitlab-tracker-redmine = { version = "0.3.1", path = "../gitlab-tracker-redmine", optional = true }

ratatui = { version = "0.30", features = ["crossterm_0_28"] }
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "native-tls-vendored"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
urlencoding = "2.1"
directories = "5.0"
keyring = "2"
open = "5"
arboard = { version = "3", default-features = false }
clap = { version = "4.6.3", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
futures = "0.3"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }
rpassword = "7"
