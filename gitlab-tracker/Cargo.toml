[package]
name = "gitlab-tracker"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
description = "A fast terminal TUI dashboard for tracking GitLab Merge Requests across branches"
keywords = ["gitlab", "tui", "ratatui", "cli", "dashboard"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["../assets/"]

[[bin]]
name = "gitlab-tracker"
path = "src/main.rs"

[features]
default = ["notifications"]
notifications = ["dep:notify-rust"]
redmine = ["dep:gitlab-tracker-redmine"]
stats = ["dep:gitlab-tracker-stats"]
# Desktop window (`gitlab-tracker gui`) over the same app state as the TUI.
# Needs Rust 1.95 (bevel); bevel is a local path dependency for now, so this
# feature is not publishable yet.
gui = [
    "dep:eframe",
    "dep:egui",
    "dep:egui_extras",
    "dep:bevel-i18n",
    "dep:bevel-theme",
    "dep:bevel-widgets",
    "dep:bevel-window",
]

[dependencies]
gitlab-tracker-core = { workspace = true, features = ["secrets"] }
# `TrackerProvider` implementations: the demo's tracker and the tests' doubles.
async-trait.workspace = true
gitlab-tracker-redmine = { workspace = true, optional = true }
gitlab-tracker-stats = { workspace = true, optional = true }
inventory.workspace = true
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
terminal-colorsaurus = "1.0.3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
dotenvy = "0.15"
urlencoding = "2.1"
directories.workspace = true
keyring.workspace = true
open.workspace = true
thiserror.workspace = true
anyhow.workspace = true
# Desktop notifications (feature `notifications`, on by default).
notify-rust = { version = "4", optional = true }
arboard = { version = "3", default-features = false }
clap = { version = "4.6.3", features = ["derive"] }
chrono.workspace = true
futures = "0.3"
toml.workspace = true
figment = { version = "0.10", features = ["toml", "json", "env"] }
tracing.workspace = true
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize.workspace = true
# GUI (feature `gui`).
eframe = { version = "0.37", optional = true, default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "system_fonts", "wayland", "x11"] }
egui = { version = "0.37", optional = true }
egui_extras = { version = "0.37", optional = true, default-features = false }
bevel-i18n = { path = "../../bevel/bevel-i18n", optional = true }
bevel-theme = { path = "../../bevel/bevel-theme", optional = true, features = ["fonts"] }
bevel-widgets = { path = "../../bevel/bevel-widgets", optional = true }
bevel-window = { path = "../../bevel/bevel-window", optional = true, features = ["egui"] }

# cargo-release (declared on this package only, so it runs once per release):
# prepends this release's section to CHANGELOG.md, with the same cliff.toml as the
# GitHub release notes (release.yml), so both are identical. The hook also runs
# during the dry run (DRY_RUN=true): it then only prints the section.
[package.metadata.release]
pre-release-hook = [
  "sh", "-c",
  'cd "$WORKSPACE_ROOT" && if [ "$DRY_RUN" = true ]; then git cliff --unreleased --tag "v$NEW_VERSION" --strip header; else git cliff --unreleased --tag "v$NEW_VERSION" --prepend CHANGELOG.md; fi',
]
