[package]
name = "gitlab-tracker-redmine"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional Redmine integration plugin for gitlab-tracker"
keywords = ["gitlab", "redmine", "tracker", "tui"]
categories = ["command-line-utilities"]

[dependencies]
gitlab-tracker-core = { version = "0.3.6", path = "../gitlab-tracker-core" }
inventory = "0.3"

async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_yml = "0.0.12"
reqwest = { version = "0.12", features = ["json", "native-tls-vendored"] }
tokio = { version = "1", features = ["full"] }
keyring = { version = "3", features = ["sync-secret-service", "crypto-openssl"] }
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }
directories = "5.0"
regex = "1"
tracing = "0.1"
rpassword = "7"
