# Weekly dependency updates. Minor and patch bumps come grouped in one pull
# request per ecosystem, so a week's updates are one review; a major bump gets a
# pull request of its own (it may need code changes). CI runs on each.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor:
        update-types: [minor, patch]
    ignore:
      # The workspace's own crates, pinned with `=` and bumped by cargo-release.
      - dependency-name: "gitlab-tracker*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
