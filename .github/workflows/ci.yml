name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  check:
    name: Compile & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      # --all-features: code behind `stats` / `redmine` is otherwise never linted or tested.
      - name: Clippy Analysis
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

  # `check` only sees --all-features: this job covers what a feature being *off*
  # can break (the default build is what `cargo install` produces), and `core`
  # built alone, without the `secrets` feature the other crates turn on.
  features:
    name: Feature Sets & Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: features

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

      - name: Clippy (stats only)
        run: cargo clippy --workspace --all-targets --features stats -- -D warnings

      - name: Clippy (redmine only)
        run: cargo clippy --workspace --all-targets --features redmine -- -D warnings

      - name: Clippy (core alone, without `secrets`)
        run: cargo clippy -p gitlab-tracker-core --all-targets -- -D warnings

      # Test counts differ without `stats` / `redmine`: run the default build's too.
      - name: Tests (default features)
        run: cargo test -p gitlab-tracker

      - name: Docs
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The toolchain is read from `rust-version` in Cargo.toml: one place to bump.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      # --locked: the committed lockfile is the one resolved for this toolchain.
      - name: Check (rust ${{ steps.msrv.outputs.version }})
        run: cargo check --workspace --all-features --locked

  # Informational only: no threshold, the job never gates a merge on a percentage.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Doctests are not instrumented (needs nightly); unit and integration tests are.
      - name: Tests with coverage
        run: cargo llvm-cov --workspace --all-features --no-report

      # Per-file table in the run's "Summary" tab (also echoed in the log).
      - name: Coverage summary
        run: |
          cargo llvm-cov report --summary-only | tee coverage.txt
          {
            echo '## Coverage'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: HTML report
        run: cargo llvm-cov report --html

      # Line-by-line report, downloadable from the run page. Skipped under act
      # (ACT=true), which has no artifact store.
      - name: Upload HTML report
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: target/llvm-cov/html
          retention-days: 14
