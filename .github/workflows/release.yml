name: Automated Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Creates the GitHub release with this tag's section of the changelog, generated
  # by git-cliff from the same cliff.toml as CHANGELOG.md (cargo-release hook), so
  # the release notes are exactly the commits since the previous tag.
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags: git-cliff needs the previous tag

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      # Local runs with nektos/act (which sets ACT=true) only print the notes:
      # they must never create a real release.
      - name: Preview release notes (act only)
        if: ${{ env.ACT }}
        run: cat RELEASE_NOTES.md

      - name: Create release
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The binaries, one per target, attached to the GitHub release. The usual Rust
  # release targets: Linux x86_64 and ARM64, macOS Apple Silicon and Intel,
  # Windows x86_64. Each one is built natively on its own runner (no
  # cross-compiler: the OS keyring needs the target's D-Bus and OpenSSL), with
  # every feature, and archived with the README, the licence and a SHA-256.
  build-release:
    # The release (and its notes) must exist before the binaries are attached.
    needs: github-release
    permissions:
      contents: write
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04: glibc 2.35, so the binary also runs on older distributions.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # Built on the same Apple Silicon runner: Apple's toolchain targets both.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    env:
      # Oldest macOS the binaries run on.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libssl-dev pkg-config

      - name: Build Release Binary
        run: cargo build --release --locked --all-features --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          name="gitlab-tracker-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE CHANGELOG.md "$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/gitlab-tracker.exe" "$name/"
            archive="$name.zip"
            7z a -tzip "$archive" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/gitlab-tracker" "$name/"
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Show archive (act only)
        if: ${{ env.ACT }}
        run: ls -l ${{ steps.package.outputs.archive }}*

      - name: Upload Release Asset
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Last: a version on crates.io can never be replaced, so it is published only
  # once every target has built.
  publish-crates:
    name: Publish to Crates.io
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libssl-dev pkg-config

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # `cargo publish --workspace` publishes in dependency order (core first, the
      # binary last) and waits for each crate to reach the crates.io index.
      # Under act (ACT=true) it is a dry run: packages and verifies, uploads nothing.
      - name: Publish crates
        run: cargo publish --workspace ${{ env.ACT && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
