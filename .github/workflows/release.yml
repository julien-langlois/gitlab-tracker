name: Automated Release

on:
  push:
    tags:
      - 'v*'
  # "Run workflow" on a branch: a rehearsal. Every target is built and packaged,
  # the installers are downloadable from the run's page; nothing is published
  # (no GitHub release, no crates.io).
  workflow_dispatch:

jobs:
  # Creates the GitHub release with this tag's section of the changelog, generated
  # by git-cliff from the same cliff.toml as CHANGELOG.md (cargo-release hook), so
  # the release notes are exactly the commits since the previous tag.
  github-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags: git-cliff needs the previous tag

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      # Local runs with nektos/act (which sets ACT=true) only print the notes:
      # they must never create a real release.
      - name: Preview release notes (act only)
        if: ${{ env.ACT }}
        run: cat RELEASE_NOTES.md

      - name: Create release
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The binaries, one per target, attached to the GitHub release. The usual Rust
  # release targets: Linux x86_64 and ARM64, macOS Apple Silicon and Intel,
  # Windows x86_64. Each one is built natively on its own runner (no
  # cross-compiler: the OS keyring needs the target's D-Bus and OpenSSL), with
  # every feature; archived with the README and the licence, and packaged as the
  # platform installs software: .deb and AppImage, .dmg, .msi.
  build-release:
    # The release (and its notes) must exist before the binaries are attached;
    # a rehearsal has none (skipped) and builds all the same.
    needs: github-release
    if: ${{ !cancelled() && needs.github-release.result != 'failure' }}
    permissions:
      contents: write
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04: glibc 2.35, so the binary also runs on older distributions.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # Built on the same Apple Silicon runner: Apple's toolchain targets both.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    env:
      # Oldest macOS the binaries run on.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libssl-dev pkg-config

      - name: Build Release Binary
        run: cargo build --release --locked --all-features --target ${{ matrix.target }}

      # The tag (v1.2.3); for a rehearsal, the crate's version marked as such.
      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
            echo "VERSION=v$v-rehearsal" >> "$GITHUB_ENV"
          fi

      # Everything attached to the release goes to dist/: the archive, then the
      # platform's installers, then a .sha256 for each.
      - name: Archive
        run: |
          name="gitlab-tracker-${VERSION}-${{ matrix.target }}"
          mkdir "$name" dist
          cp README.md LICENSE CHANGELOG.md "$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/gitlab-tracker.exe" "$name/"
            7z a -tzip "dist/$name.zip" "$name" > /dev/null
          else
            cp "target/${{ matrix.target }}/release/gitlab-tracker" "$name/"
            tar -czf "dist/$name.tar.gz" "$name"
          fi

      # .deb (applications menu entry, icons, dependencies on D-Bus and OpenSSL)
      # and an AppImage (runs on any distribution, double-click opens the window).
      - name: Installers (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked --version 3.8.0
          cargo deb -p gitlab-tracker --no-build --target ${{ matrix.target }} --output dist/
          sh packaging/linux/appimage.sh "target/${{ matrix.target }}/release/gitlab-tracker" \
            "$VERSION" dist

      - name: Installer (macOS)
        if: runner.os == 'macOS'
        run: |
          sh packaging/macos/dmg.sh "target/${{ matrix.target }}/release/gitlab-tracker" \
            "$VERSION" ${{ matrix.target }} dist

      # WiX 5 (pinned: WiX 6 asks every build to accept a maintenance-fee EULA).
      # An MSI version is numbers only: v1.2.3-rc.1 → 1.2.3.
      - name: Installer (Windows)
        if: runner.os == 'Windows'
        run: |
          dotnet tool install --global wix --version 5.0.2
          version="${VERSION#v}"
          wix build packaging/windows/gitlab-tracker.wxs -arch x64 \
            -d Version="${version%%-*}" \
            -d Binary="target/${{ matrix.target }}/release/gitlab-tracker.exe" \
            -d Root=. \
            -o "dist/gitlab-tracker-${VERSION}-${{ matrix.target }}.msi"

      - name: Checksums
        run: |
          cd dist
          for f in *; do
            if command -v sha256sum > /dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -l

      - name: Upload Release Assets
        if: ${{ !env.ACT && github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload rehearsal artifacts
        if: ${{ !env.ACT && github.ref_type != 'tag' }}
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-tracker-${{ matrix.target }}
          path: dist/*
          retention-days: 7

  # The SBOM (CycloneDX JSON) of the shipped binary: every crate built into it,
  # with versions, licences and checksums, as built (--all-features, no build
  # dependencies). One file for all targets; attached to the release.
  sbom:
    name: SBOM
    needs: github-release
    if: ${{ !cancelled() && needs.github-release.result != 'failure' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.10

      # cargo-cyclonedx writes one file per workspace member: only the binary's ships.
      - name: Generate SBOM
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"
          else version="v$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)-rehearsal"; fi
          cargo cyclonedx --all-features --no-build-deps --format json \
            --override-filename "gitlab-tracker-${version}.cdx"
          mkdir dist
          mv "gitlab-tracker/gitlab-tracker-${version}.cdx.json" dist/
          (cd dist && sha256sum * > "gitlab-tracker-${version}.cdx.json.sha256")

      - name: Upload SBOM
        if: ${{ !env.ACT && github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload rehearsal SBOM
        if: ${{ !env.ACT && github.ref_type != 'tag' }}
        uses: actions/upload-artifact@v4
        with:
          name: gitlab-tracker-sbom
          path: dist/*
          retention-days: 7

  # Last: a version on crates.io can never be replaced, so it is published only
  # once every target has built.
  publish-crates:
    name: Publish to Crates.io
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libssl-dev pkg-config

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # `cargo publish --workspace` publishes in dependency order (core first, the
      # binary last) and waits for each crate to reach the crates.io index.
      # Under act (ACT=true) it is a dry run: packages and verifies, uploads nothing.
      - name: Publish crates
        run: cargo publish --workspace ${{ env.ACT && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
