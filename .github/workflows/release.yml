name: Automated Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Creates the GitHub release with this tag's section of the changelog, generated
  # by git-cliff from the same cliff.toml as CHANGELOG.md (cargo-release hook), so
  # the release notes are exactly the commits since the previous tag.
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags: git-cliff needs the previous tag

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      # Local runs with nektos/act (which sets ACT=true) only print the notes:
      # they must never create a real release.
      - name: Preview release notes (act only)
        if: ${{ env.ACT }}
        run: cat RELEASE_NOTES.md

      - name: Create release
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # `cargo publish --workspace` publishes in dependency order (core first, the
      # binary last) and waits for each crate to reach the crates.io index.
      # Under act (ACT=true) it is a dry run: packages and verifies, uploads nothing.
      - name: Publish crates
        run: cargo publish --workspace ${{ env.ACT && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-release:
    # The release (and its notes) must exist before the binaries are attached.
    needs: github-release
    permissions:
      contents: write
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_name: gitlab-tracker-linux-amd64.tar.gz
          # - target: aarch64-unknown-linux-gnu
          #   os: ubuntu-latest
          #   archive_name: gitlab-tracker-linux-arm64.tar.gz
          # - target: x86_64-apple-darwin
          #   os: macos-latest
          #   archive_name: gitlab-tracker-macos-amd64.tar.gz
          # - target: aarch64-apple-darwin
          #   os: macos-latest
          #   archive_name: gitlab-tracker-macos-arm64.tar.gz
          # - target: x86_64-pc-windows-msvc
          #   os: windows-latest
          #   archive_name: gitlab-tracker-windows-amd64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Cross-Linker (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive_name }} gitlab-tracker

      - name: Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path gitlab-tracker.exe -DestinationPath ../../../${{ matrix.archive_name }}

      - name: Show archive (act only)
        if: ${{ env.ACT }}
        run: ls -l ${{ matrix.archive_name }}

      - name: Upload Release Asset
        if: ${{ !env.ACT }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
