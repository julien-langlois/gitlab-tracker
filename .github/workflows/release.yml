name: Automated Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-crates:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish gitlab-tracker-core
        run: cargo publish --package gitlab-tracker-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index propagation
        run: sleep 30

      - name: Publish gitlab-tracker-notify
        run: cargo publish --package gitlab-tracker-notify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish gitlab-tracker-redmine
        run: cargo publish --package gitlab-tracker-redmine
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index propagation
        run: sleep 30

      - name: Publish gitlab-tracker
        run: cargo publish --package gitlab-tracker
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_name: gitlab-tracker-linux-amd64.tar.gz
          # - target: aarch64-unknown-linux-gnu
          #   os: ubuntu-latest
          #   archive_name: gitlab-tracker-linux-arm64.tar.gz
          # - target: x86_64-apple-darwin
          #   os: macos-latest
          #   archive_name: gitlab-tracker-macos-amd64.tar.gz
          # - target: aarch64-apple-darwin
          #   os: macos-latest
          #   archive_name: gitlab-tracker-macos-arm64.tar.gz
          # - target: x86_64-pc-windows-msvc
          #   os: windows-latest
          #   archive_name: gitlab-tracker-windows-amd64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Cross-Linker (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive_name }} gitlab-tracker

      - name: Package Binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path gitlab-tracker.exe -DestinationPath ../../../${{ matrix.archive_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
