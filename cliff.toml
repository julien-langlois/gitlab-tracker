[changelog]
# Template for the changelog body (uses Tera templating)
header = """
# CHANGELOG\n
All notable changes to this project will be documented in this file.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
# Parse commits according to the Conventional Commits specification
conventional_commits = true
filter_unconventional = true
split_commits = false

# Group commits by their type
commit_parsers = [
  # Skip release commits first
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore: [Rr]elease", skip = true },

  # Scope-based rules: any type with a ui/demo scope is grouped by scope
  { message = "^[a-z]+\\(ui\\)", group = "<!-- 9 -->🖥️ UI" },
  { message = "^[a-z]+\\(demo\\)", group = "<!-- 10 -->🎬 Demo" },
  { message = "^[a-z]+\\(ci\\)", group = "<!-- 8 -->👷 CI" },
  { message = "^[a-z]+\\(build\\)", group = "<!-- 7 -->🏗️ Build" },

  # Type-based rules (fallback when no scope override applies)
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^doc", group = "<!-- 2 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 3 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 4 -->🔨 Refactor" },
  { message = "^style", group = "<!-- 5 -->🎨 Styling" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^build", group = "<!-- 7 -->🏗️ Build" },
  { message = "^ci", group = "<!-- 8 -->👷 CI" },
  { message = "^ui", group = "<!-- 9 -->🖥️ UI" },
  { message = "^demo", group = "<!-- 10 -->🎬 Demo" },
  { message = "^chore", group = "<!-- 11 -->⚙️ Miscellaneous" },
]

# Only include well-formed semver tags (excludes empty-regex pitfall)
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "newest"
