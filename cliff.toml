[changelog]
# Template for the changelog body (uses Tera templating).
# The same template feeds CHANGELOG.md (cargo-release pre-release hook) and the
# GitHub release notes (release.yml, `git cliff --current --strip header`), so both
# always show the same section.
header = """
# CHANGELOG\n
All notable changes to this project will be documented in this file.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{# Groups are numbered <!-- NN --> with two digits: sorting the commits by group
   first makes `group_by` emit them in that order. #}\
{% for group, commits in commits | sort(attribute="group") | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}[**breaking**] {% endif %}{% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
{% if previous.version %}
**Full Changelog**: https://github.com/julien-langlois/gitlab-tracker/compare/{{ previous.version }}...{% if version %}{{ version }}{% else %}HEAD{% endif %}
{% endif %}\n
"""
footer = ""
trim = true

[git]
# Parse commits according to the Conventional Commits specification
conventional_commits = true
filter_unconventional = true
split_commits = false

# One group per commit type; the scope is shown in bold on each line.
commit_parsers = [
  # Release bookkeeping never belongs in the notes.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore: [Rr]elease", skip = true },
  { message = "^chore\\(changelog\\)", skip = true },

  { message = "^feat", group = "<!-- 00 -->🚀 Features" },
  { message = "^fix", group = "<!-- 01 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 02 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 03 -->🔨 Refactor" },
  { message = "^doc", group = "<!-- 04 -->📚 Documentation" },
  { message = "^test", group = "<!-- 05 -->🧪 Tests" },
  { message = "^style", group = "<!-- 06 -->🎨 Styling" },
  { message = "^build", group = "<!-- 07 -->🏗️ Build" },
  { message = "^ci", group = "<!-- 08 -->👷 CI" },
  { message = "^ui", group = "<!-- 09 -->🖥️ UI" },
  { message = "^demo", group = "<!-- 10 -->🎬 Demo" },
  { message = "^chore", group = "<!-- 11 -->⚙️ Miscellaneous" },
]

# Only include well-formed semver tags (excludes empty-regex pitfall)
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "newest"
