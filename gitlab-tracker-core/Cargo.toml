[package]
name = "gitlab-tracker-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared contracts and domain types for gitlab-tracker plugins"
keywords = ["gitlab", "tracker", "plugin", "tui"]
categories = ["command-line-utilities"]

[dependencies]
serde.workspace = true
async-trait.workspace = true
inventory.workspace = true
thiserror.workspace = true
toml.workspace = true
# Token resolution (env var → OS keyring → prompt), only for crates that need it.
keyring = { workspace = true, optional = true }
rpassword = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync", "time"] }

[features]
secrets = ["dep:keyring", "dep:rpassword", "dep:tracing", "dep:zeroize"]
# Per-instance request pacing (shared concurrency limit, 429 / Retry-After pauses).
pacing = ["dep:reqwest", "dep:tokio", "dep:tracing"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util", "time"] }
