# cargo deny check: advisories (RustSec), licences, banned / duplicate crates,
# and where dependencies come from. Run in CI (`ci.yml`, job `deny`).

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails,
# unless it is listed below with the reason it does not apply.
ignore = [
    # chrono / chrono-tz flagged unmaintained, no successor release to move to.
    # Not a vulnerability; leaving them (for jiff) is a migration of its own.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no fix available; migration tracked separately" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained, no fix available; migration tracked separately" },
]

[licenses]
# Permissive licences only: the app ships as MIT binaries and installers.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0", # webpki-roots: the Mozilla root certificates list
    "OFL-1.1",             # egui's bundled fonts
    "Ubuntu-font-1.0",     # egui's bundled fonts
    "MPL-2.0",             # option-ext (via directories): file-level copyleft, unmodified, fine in an MIT binary
]
confidence-threshold = 0.9

[bans]
# Several versions of one crate are common in the egui/wgpu tree: reported, not fatal.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own path dependencies carry a version too, but are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
