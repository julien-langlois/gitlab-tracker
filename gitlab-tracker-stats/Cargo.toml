[package]
name = "gitlab-tracker-stats"
description = "Analytics and correlation engine for gitlab-tracker MR data."
readme = "README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait          = "0.1"
chrono               = { version = "0.4", features = ["serde"] }
gitlab-tracker-core  = { version = "0.4.8", path = "../gitlab-tracker-core" }
inventory            = "0.3"
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
toml                 = { version = "0.8", features = ["parse"] }
sqlx                 = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate"] }
thiserror            = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
