[package]
name = "gitlab-tracker-stats"
description = "Analytics and correlation engine for gitlab-tracker MR data."
readme = "README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
chrono = { workspace = true, features = ["serde"] }
gitlab-tracker-core.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sqlx                 = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate"] }
thiserror.workspace = true
tracing.workspace = true
[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
