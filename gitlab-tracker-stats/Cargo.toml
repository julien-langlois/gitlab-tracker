[package]
name = "gitlab-tracker-stats"
description = "Analytics and correlation engine for gitlab-tracker MR data."
readme = "README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
# sqlx 0.9 (the stats database) needs 1.94; the other crates keep the workspace's.
rust-version = "1.94"
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { workspace = true, features = ["serde"] }
gitlab-tracker-core.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true
[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
